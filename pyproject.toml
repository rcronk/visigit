[build-system]
requires = ["setuptools>=61", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "visigit"
dynamic = ["version"]
description = "Graphviz visualizations of git repository structure"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Robert Cronk", email = "cronk.r@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "gitpython>=3.1",
    "graphviz>=0.20",
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "graphifyy>=0.8; python_version >= '3.10'",
]

[project.scripts]
visigit = "visigit.cli:main"

[project.urls]
Repository = "https://github.com/rcronk/visigit"
Changelog = "https://github.com/rcronk/visigit/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["visigit*"]

[tool.setuptools.package-data]
visigit = ["display.html"]

[tool.setuptools_scm]
# The publish workflow (issue #60) sets SETUPTOOLS_SCM_PRETEND_VERSION so a
# build embeds the version we're about to tag *before* the tag exists --
# tagging happens only after a successful PyPI publish, so a failed publish
# never leaves a dangling tag. version_file makes the resolved version
# importable at runtime without needing the package to be pip-installed.
version_file = "visigit/_version.py"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["tstrepo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
