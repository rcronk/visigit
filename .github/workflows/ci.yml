name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      bump_override:
        description: "Force a specific version bump instead of the automatic decision (see issue #60)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system graphviz
        run: sudo apt-get install -y graphviz

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Coverage (must not drop below baseline)
        run: |
          pytest --cov=visigit --cov-report=term-missing --cov-fail-under=92
          # Baseline recorded 2026-07-11 at 92.61% (cli.py 98.57%, renderer.py
          # 100%, repo.py 89.32%, builder.py 94.47%, mermaid.py 93.81%,
          # monitor.py 93.65%). If this fails on an intentional drop (e.g. new
          # code that's hard to unit test), raise coverage to compensate rather
          # than lowering this number -- it's a floor, not a target.

      - name: Check for CRLF line endings
        run: |
          bad=$(git ls-files | xargs grep -lU $'\r' 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "CRLF line endings found:"
            echo "$bad"
            exit 1
          fi

      - name: Check file sizes (100 KB limit)
        run: |
          LIMIT=102400
          failed=0
          while IFS= read -r f; do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -gt "$LIMIT" ]; then
              echo "FAIL ($size bytes): $f"
              failed=1
            fi
          done < <(git ls-files)
          exit $failed

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system graphviz (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y graphviz

      - name: Install system graphviz (Windows)
        if: runner.os == 'Windows'
        run: choco install graphviz --no-progress

      - name: Add graphviz to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/Program Files/Graphviz/bin" >> "$GITHUB_PATH"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  breaking-change-gate:
    name: breaking-change gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history, so we can find the last release tag

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Find last release tag
        id: last_tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Detect breaking CLI changes
        id: detect
        run: |
          if python scripts/detect_breaking_cli_changes.py "${{ steps.last_tag.outputs.tag }}" HEAD; then
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          else
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a confirming label when a breaking change is detected
        if: steps.detect.outputs.breaking == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABELS=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json labels --jq '.labels[].name')
          if echo "$LABELS" | grep -qx "not-breaking"; then
            echo "Labelled 'not-breaking' -- treating the detection above as a false positive."
            exit 0
          fi
          if echo "$LABELS" | grep -qx "breaking-change"; then
            echo "Labelled 'breaking-change' -- confirmed; the next release will be a major version bump."
            exit 0
          fi
          echo "::error::Possible breaking CLI change(s) detected against ${{ steps.last_tag.outputs.tag }} (see the 'Detect breaking CLI changes' step above). Add the 'breaking-change' label to confirm it (publishes as a major bump), or 'not-breaking' if this is a false positive, then re-run this check."
          exit 1

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [checks, test]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write       # push the version tag, create the GitHub release
      pull-requests: read   # look up the merging PR's labels

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history, so we can find tags and diff since the last one

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Skip if HEAD is already tagged
        id: already_tagged
        run: |
          if git describe --tags --exact-match HEAD > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HEAD is already tagged ($(git describe --tags --exact-match HEAD)) -- nothing new to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find last release tag
        id: last_tag
        if: steps.already_tagged.outputs.skip == 'false'
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Find the PR that produced this commit
        id: pr
        if: steps.already_tagged.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          BREAKING=false
          if [ -n "$NUMBER" ]; then
            LABELS=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].labels[].name')
            echo "$LABELS" | grep -qx "breaking-change" && BREAKING=true
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "breaking=$BREAKING" >> "$GITHUB_OUTPUT"

      # Independent of the PR-level gate (defense in depth: branch protection
      # misconfiguration, a direct push to main, etc). Skipped when a human has
      # already manually confirmed a major release via workflow_dispatch.
      - name: Safety-net breaking-change check
        if: steps.already_tagged.outputs.skip == 'false' && steps.pr.outputs.breaking == 'false' && github.event.inputs.bump_override != 'major'
        run: |
          if ! python scripts/detect_breaking_cli_changes.py "${{ steps.last_tag.outputs.tag }}" HEAD; then
            echo "::error::Possible breaking CLI change(s) reached main without a 'breaking-change' label on the merging PR (#${{ steps.pr.outputs.number }}). Refusing to publish -- no tag was created, nothing was uploaded. Add the label to that PR, then re-run this workflow manually (Actions -> CI -> Run workflow) with bump_override=major (or minor/patch if this is a false positive)."
            exit 1
          fi

      - name: Lines changed in visigit/ since last tag
        id: diffstat
        if: steps.already_tagged.outputs.skip == 'false'
        run: |
          LINES=$(git diff --numstat "${{ steps.last_tag.outputs.tag }}"..HEAD -- visigit/ | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        if: steps.already_tagged.outputs.skip == 'false'
        run: |
          ARGS=(--last-tag "${{ steps.last_tag.outputs.tag }}" --lines-changed "${{ steps.diffstat.outputs.lines }}" --threshold 200 --override "${{ github.event.inputs.bump_override || 'auto' }}")
          if [ "${{ steps.pr.outputs.breaking }}" = "true" ]; then
            ARGS+=(--breaking)
          fi
          VERSION=$(python scripts/compute_next_version.py "${ARGS[@]}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # setuptools-scm embeds this version into the build; no tag exists yet,
      # so a build/publish failure below leaves nothing dangling to clean up.
      - name: Build wheel and sdist
        if: steps.already_tagged.outputs.skip == 'false'
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: pip install build && python -m build

      - name: Publish to PyPI
        if: steps.already_tagged.outputs.skip == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      # Tag only after a successful publish -- see the comment above.
      - name: Tag the release
        if: steps.already_tagged.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release with changelog
        if: steps.already_tagged.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --generate-notes
